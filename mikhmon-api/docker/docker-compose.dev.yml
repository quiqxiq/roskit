services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mikhmon
      POSTGRES_PASSWORD: mikhmon
      POSTGRES_DB: mikhmon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikhmon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:3-core
    command: influxdb3 serve --node-id dev-node --object-store file --data-dir /var/lib/influxdb3 --without-auth
    ports:
      - "8181:8181"
    environment:
      INFLUXDB3_AUTH_TOKEN: dev-influx-token-change-in-prod
    volumes:
      - influxdata:/var/lib/influxdb3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: mikhmon
      DB_PASSWORD: mikhmon
      DB_NAME: mikhmon
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      INFLUXDB_URL: http://influxdb:8181
      INFLUXDB_TOKEN: dev-influx-token-change-in-prod
      INFLUXDB_DATABASE: mikhmon
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-production
      AES_ENCRYPTION_KEY: "/hMHA8gmJHT3z1YxEfmkRBlVNyNx3I/z2GqegQr5xFw="

volumes:
  pgdata:
  redisdata:
  influxdata:
