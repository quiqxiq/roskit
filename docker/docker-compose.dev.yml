services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mikhmon
      POSTGRES_PASSWORD: mikhmon
      POSTGRES_DB: mikhmon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikhmon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:3-core
    command: influxdb3 serve --node-id dev-node --object-store file --data-dir /var/lib/influxdb3 --without-auth
    ports:
      - "8181:8181"
    environment:
      INFLUXDB3_AUTH_TOKEN: dev-influx-token-change-in-prod
    volumes:
      - influxdata:/var/lib/influxdb3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: mikhmon
      DB_PASSWORD: mikhmon
      DB_NAME: mikhmon
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      INFLUXDB_URL: http://influxdb:8181
      INFLUXDB_TOKEN: dev-influx-token-change-in-prod
      INFLUXDB_DATABASE: mikhmon
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-production
      AES_ENCRYPTION_KEY: "/hMHA8gmJHT3z1YxEfmkRBlVNyNx3I/z2GqegQr5xFw="

  redocly-preview:
    # Pinned to 1.x — v2.x removed `preview-docs` (renamed to `preview` with
    # different project-based workflow). See: https://redocly.com/docs/cli/guides/migrate-to-v2
    image: redocly/cli:1.34.13
    profiles: ["docs"]
    command: preview-docs /spec/openapi.yaml --host 0.0.0.0 --port 8080
    working_dir: /spec
    ports:
      - "8082:8080"
    volumes:
      - ../docs/openapi:/spec:ro,z
    restart: unless-stopped

  openapi-bundler:
    image: redocly/cli:1.34.13
    profiles: ["docs"]
    command: bundle /spec/openapi.yaml -o /output/openapi.yaml
    working_dir: /spec
    volumes:
      - ../docs/openapi:/spec:ro,z
      - bundled-spec:/output

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    profiles: ["docs"]
    depends_on:
      openapi-bundler:
        condition: service_completed_successfully
    ports:
      - "8083:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /
      DEEP_LINKING: "true"
      DISPLAY_OPERATION_ID: "true"
      DOC_EXPANSION: list
      DEFAULT_MODELS_EXPAND_DEPTH: "1"
      TRY_IT_OUT_ENABLED: "true"
    volumes:
      - bundled-spec:/spec:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  influxdata:
  bundled-spec:
