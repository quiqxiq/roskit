services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-mikhmon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mikhmon}
      POSTGRES_DB: ${DB_NAME:-mikhmon}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mikhmon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      sh -c '[ -n "$$REDIS_PASSWORD" ] && redis-server --requirepass "$$REDIS_PASSWORD" || redis-server'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:3-core
    command: influxdb3 serve --node-id prod-node --object-store file --data-dir /var/lib/influxdb3
    profiles: ["metrics"]
    ports:
      - "8181:8181"
    environment:
      INFLUXDB3_AUTH_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-auth-token}
    volumes:
      - influxdata:/var/lib/influxdb3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: Bearer ${INFLUXDB_TOKEN:-my-super-secret-auth-token}\" http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: mikhmon-api:latest
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env

  frontend:
    profiles: ["frontend"]
    build:
      context: ../../mikhmon-ui
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:${PORT:-8080}

  redocly-preview:
    # Pinned to 1.x — v2.x removed `preview-docs` (renamed to `preview` with
    # different project-based workflow). See: https://redocly.com/docs/cli/guides/migrate-to-v2
    image: redocly/cli:1.34.13
    profiles: ["docs"]
    command: preview-docs /spec/openapi.yaml --host 0.0.0.0 --port 8080
    working_dir: /spec
    ports:
      - "${DOCS_REDOCLY_PORT:-8082}:8080"
    volumes:
      - ../docs/openapi:/spec:ro
    restart: unless-stopped

  openapi-bundler:
    image: redocly/cli:1.34.13
    profiles: ["docs"]
    command: bundle /spec/openapi.yaml -o /output/openapi.yaml
    working_dir: /spec
    volumes:
      - ../docs/openapi:/spec:ro
      - bundled-spec:/output

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    profiles: ["docs"]
    depends_on:
      openapi-bundler:
        condition: service_completed_successfully
    ports:
      - "${DOCS_SWAGGER_PORT:-8083}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /
      DEEP_LINKING: "true"
      DISPLAY_OPERATION_ID: "true"
      DOC_EXPANSION: list
      DEFAULT_MODELS_EXPAND_DEPTH: "1"
      TRY_IT_OUT_ENABLED: "true"
    volumes:
      - bundled-spec:/spec:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  influxdata:
  bundled-spec:
