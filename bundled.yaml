  /routers/{routerId}/vouchers/sales:
    post:
      operationId: recordVoucherSale
      summary: Record a voucher as sold (idempotent by user+sold_at)
      tags:
        - vouchers
      description: |
        Persists a `voucher_sales` row. Idempotency is enforced by a
        composite key derived from router + username + sold_at, so the
        same on-login event delivered twice cannot double-count revenue.
      parameters:
        - $ref: '#/components/parameters/RouterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSaleParams'
            example:
              username: voucher-7g3pq
              profile_name: 1d-1mbps
              price: 7500
              sold_at: '2026-04-30T10:11:12Z'
      responses:
        '200':
          description: Sale recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyOK'
              example:
                data:
                  message: sale recorded
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
