          maxLength: 64
        time_limit:
          type: string
          maxLength: 64
        data_limit:
          type: string
          maxLength: 64
        price:
          type: string
          maxLength: 64
        comment:
          type: string
          maxLength: 200
        user_mode:
          type: string
          maxLength: 32
        logo:
          type: string
