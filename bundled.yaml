          type: string
          maxLength: 32
          example: vc
        user_length:
          type: string
          maxLength: 8
          example: '6'
        prefix:
          type: string
          maxLength: 16
        char_mode:
          type: string
          maxLength: 32
        profile:
          type: string
          maxLength: 64
        time_limit:
          type: string
          maxLength: 64
        data_limit:
          type: string
          maxLength: 64
        comment:
          type: string
          maxLength: 200
        validity:
          type: string
          maxLength: 64
        price:
          type: string
          maxLength: 64
        selling_price:
          type: string
          maxLength: 64
        lock_user:
          type: string
          maxLength: 32
    ProfilePriceMapping:
      type: object
      required:
        - id
        - router_id
        - profile_name
      description: |
        Per-router metadata for a hotspot profile name. Roskit overlays
        these values onto `/hotspot/profiles` responses (price, validity,
        expiration mode, lock flags). Profiles missing a mapping fall back
        to defaults defined elsewhere.
      properties:
        id:
          type: integer
          format: int64
        router_id:
          type: integer
          format: int64
        profile_name:
          type: string
          maxLength: 100
          example: 1d-1mbps
        price:
          type: integer
          format: int64
          minimum: 0
          example: 5000
        selling_price:
          type: integer
          format: int64
          minimum: 0
          example: 7500
        validity:
          type: string
          maxLength: 20
          example: 1d
        exp_mode:
          type: string
          maxLength: 10
          example: rem
        lock_user:
          type: boolean
        lock_server:
          type: boolean
    UpdateMappingRequest:
      type: object
      description: Patch — only supplied fields are applied.
      properties:
        price:
          type: integer
          format: int64
          minimum: 0
        selling_price:
          type: integer
          format: int64
          minimum: 0
        validity:
          type: string
          maxLength: 64
        exp_mode:
          type: string
          maxLength: 32
        lock_user:
          type: boolean
        lock_server:
          type: boolean
    OnLoginPayload:
      type: object
      description: |
        Form-encoded body POSTed by the on-login RouterOS scheduler.
        `username` and `router_name` are required; everything else is
        informational.
      properties:
        router_name:
          type: string
          maxLength: 100
          example: hotspot-1
        server:
          type: string
          maxLength: 64
          example: hotspot1
        username:
          type: string
          maxLength: 64
          example: voucher-7g3pq
        mac:
          type: string
          maxLength: 17
          example: '00:11:22:33:44:55'
        ip:
          type: string
          maxLength: 45
          example: 10.5.50.23
        date:
          type: string
          maxLength: 32
          example: apr/30/2026
        time:
          type: string
          maxLength: 32
          example: '10:11:12'
        profile:
          type: string
          maxLength: 64
          example: 1d-1mbps
        token:
          type: string
          description: Webhook token. Use the `X-Router-Token` header instead when possible.
    LogEvent:
      type: object
      description: One row from the RouterOS log stream.
      properties:
        time:
          type: string
          example: apr/30 10:11:12
        topics:
          type: string
          example: hotspot,info
        message:
          type: string
        router_id:
          type: string
    TelemetryEvent:
      type: object
      required:
        - measurement
        - tags
      description: |
        A single telemetry event multiplexed via Redis pub-sub. Clients
        filter by `measurement`; the SPA also filters by `tags.interface`
        or `tags.name` for per-interface streams.
      properties:
        measurement:
          type: string
          description: One of the telemetry topics — see the per-endpoint description.
          example: hotspot_user
        tags:
          type: object
          additionalProperties:
            type: string
          description: RouterOS-style tags propagated by the pipeline (`router_id`, `name`, `profile`, `interface`, …).
        fields:
          type: object
          additionalProperties: true
          description: Numeric/boolean payload (e.g. `bytes_in`, `cpu_load`). Shape varies per measurement.
        timestamp:
          type: string
          format: date-time
  parameters:
    RouterId:
      in: path
      name: routerId
      required: true
      description: |
        Numeric ID of a router. Validated by `RouterOwnershipMiddleware`;
        returns 404 if the router does not exist.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 7
    UserId:
      in: path
      name: id
      required: true
      description: User ID.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 12
    TemplateId:
      in: path
      name: templateId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GenericResourceId:
      in: path
      name: id
      required: true
      description: |
        RouterOS-side resource identifier as returned by `/print` calls.
        Often shaped like `*A1` for hex IDs; sometimes a numeric `numbers=`
        reference for enable/disable. Treat as opaque string.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: '*A1'
    InterfaceName:
      in: path
      name: iface
      required: true
      description: MikroTik interface name (e.g. `ether1`, `wlan1`).
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: ether1
    PageQuery:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
  responses:
    BadRequest:
      description: Invalid input — body validation failed or path/query parameter rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: invalid_input
              message: 'invalid request body: Key: ''createUserRequest.Username'' Error:Field validation for ''Username'' failed on the ''min'' tag'
    Unauthorized:
      description: Missing, malformed, expired, or revoked authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: unauthorized
              message: invalid or expired access token
    Forbidden:
      description: Authentication succeeded but the principal lacks the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: forbidden
              message: access denied
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: not_found
              message: router not found
    Conflict:
      description: Resource already exists or version conflict (e.g. duplicate username).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: conflict
              message: user already exists
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: rate_limited
              message: too many requests
    InternalError:
      description: Internal server error. Message is sanitised — does not leak stack or DB internals.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: internal
              message: internal server error
