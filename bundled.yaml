components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token issued by `POST /auth/login`. Send as
        `Authorization: Bearer <token>`. SSE endpoints additionally accept
        `?token=<token>` since EventSource cannot set custom headers.
    webhookToken:
      type: apiKey
      in: header
      name: X-Router-Token
      description: |
        Secret stored in `settings.webhook_token`. Required by
        `/events/on-login`. May also be supplied as a `token` form
        field for legacy MikroTik schedulers.
  schemas:
    Envelope:
      type: object
      required:
        - data
        - error
      description: Universal response shape. Exactly one of `data` / `error` is non-null.
      properties:
        data:
          description: Operation payload, or null on error.
        error:
          oneOf:
            - $ref: '#/components/schemas/APIError'
            - type: 'null'
    ErrorEnvelope:
      type: object
      required:
        - data
        - error
      description: Convenience alias — same shape as Envelope but with `data` always null.
      properties:
        data:
          type: 'null'
          example: null
        error:
          $ref: '#/components/schemas/APIError'
    APIError:
      type: object
      required:
        - code
        - message
      description: |
        Error envelope. `code` is a stable identifier (clients may pattern-match);
        `message` is human-readable English; `details` carries optional
        structured context (e.g. per-field validation errors).
      properties:
        code:
          type: string
          example: invalid_input
        message:
          type: string
          example: name is required
        details:
          description: Optional structured context (per-field validation, etc.)
    EmptyOK:
      type: object
      required:
        - data
        - error
      description: Generic success body with a single `message` field.
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: ok
        error:
          type: 'null'
          example: null
    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          example: 142
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          example: 50
    HealthStatus:
      type: object
      required:
        - status
        - services
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        services:
          type: object
          required:
            - postgres
            - redis
            - engine
          properties:
            postgres:
              type: string
              enum:
                - ok
                - unavailable
            redis:
              type: string
              enum:
                - ok
                - unavailable
            engine:
              type: object
              required:
                - routers_total
                - routers_connected
              properties:
                routers_total:
                  type: integer
                  minimum: 0
                  example: 4
                routers_connected:
                  type: integer
                  minimum: 0
                  example: 4
    UserStatus:
      type: object
      required:
        - active
        - mac
      description: |
        Hotspot user session snapshot. `active=false` means the MAC is not in
        `ip/hotspot/active`; in that case all string fields are empty and
        only `mac` carries the requested value.
      properties:
        active:
          type: boolean
        username:
          type: string
        profile:
          type: string
        ip_address:
          type: string
        mac:
          type: string
        uptime:
          type: string
          description: RouterOS-formatted duration (e.g. `1h12m`).
        bytes_in:
          type: string
          description: Decimal byte count as returned by RouterOS (string, not integer).
        bytes_out:
          type: string
        time_left:
          type: string
          description: RouterOS-formatted duration; empty when no time limit.
        comment:
          type: string
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          example: alice
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          example: hunter2
    UserRole:
      type: string
      enum:
        - admin
        - staff
      description: User role.
    UserView:
      type: object
      required:
        - id
        - username
        - role
      description: User identity returned in `/auth/me` and embedded in `LoginResult`.
      properties:
        id:
          type: integer
          format: int64
          example: 12
        username:
          type: string
          example: alice
        role:
          $ref: '#/components/schemas/UserRole'
    LoginResult:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: JWT access token. Short-lived (~15 min).
        refresh_token:
          type: string
          description: Opaque-looking JWT signed with the refresh secret. Longer-lived (~7 d).
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds.
          example: 900
        user:
          $ref: '#/components/schemas/UserView'
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 10
          maxLength: 4096
    LogoutRequest:
      type: object
      description: |
        Optional body. Logout always revokes the *access* token (via JTI in
        JWT claims). When `refresh_token` is provided it is revoked too — do
        this from the original device to log out everywhere.
      properties:
        refresh_token:
          type: string
          maxLength: 4096
    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        new_password:
          type: string
          minLength: 6
          maxLength: 128
          format: password
    SetupRequest:
      type: object
      required:
        - username
        - password
      description: |
        Bootstrap the first admin user. Available only when the `users`
        table is empty; subsequent calls return 403.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          example: admin
        password:
          type: string
          minLength: 6
          maxLength: 128
          format: password
    SetupResult:
      type: object
      required:
        - user
        - access_token
        - refresh_token
        - expires_in
      description: First admin user + auto-issued access tokens.
      properties:
        user:
          type: object
          required:
            - id
            - username
            - role
          properties:
            id:
              type: integer
              format: int64
              example: 1
            username:
              type: string
              example: admin
            role:
              $ref: '#/components/schemas/UserRole'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 900
    Settings:
      type: object
      required:
        - id
        - currency
        - idle_timeout
        - report_mode
        - logo_path
        - timezone
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        hotspot_name:
          type: string
          maxLength: 100
          example: My Hotspot
        dns_name:
          type: string
          maxLength: 100
          example: login.example.test
        currency:
          type: string
          maxLength: 10
          example: Rp
        phone:
          type: string
          maxLength: 20
          example: +62-555-0100
        email:
          type: string
          maxLength: 100
          example: admin@example.test
        info_lp:
          type: string
          description: Free-form text shown on the hotspot login page.
        idle_timeout:
          type: integer
          minimum: 0
          maximum: 86400
          description: Hotspot idle timeout in minutes.
          example: 30
        report_mode:
          type: string
          enum:
            - disable
            - enable
        logo_path:
          type: string
          description: Server-side filesystem path; not directly client-accessible.
        timezone:
          type: string
          maxLength: 50
          example: Asia/Jakarta
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateSettingsRequest:
      type: object
      description: |
        Partial update — every field is optional. Omitted fields are left
        unchanged on the existing Settings row.
      properties:
        hotspot_name:
          type: string
          maxLength: 100
        dns_name:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 100
        info_lp:
          type: string
        idle_timeout:
          type: integer
          minimum: 0
          maximum: 86400
        report_mode:
          type: string
          enum:
            - disable
            - enable
        timezone:
          type: string
          maxLength: 50
    User:
      type: object
      required:
        - id
        - username
        - role
        - active
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 12
        username:
          type: string
          maxLength: 100
          example: alice
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
          example: true
        last_login_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          example: alice
        password:
          type: string
          minLength: 6
          maxLength: 128
          format: password
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserRequest:
      type: object
      description: Partial update; omitted fields are unchanged.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 128
          format: password
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
    RouterStatus:
      type: string
      enum:
        - unknown
        - connecting
        - connected
        - disconnected
        - auth_failed
    RouterPublicView:
      type: object
      required:
        - id
        - name
        - ip_address
        - api_port
        - api_username
        - status
      description: |
        Public-facing router shape. Sensitive fields (encrypted password,
        SSH password) are stripped before serialisation.
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: hotspot-1
        ip_address:
          type: string
          example: 192.168.88.1
        api_port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 8728
        api_username:
          type: string
          example: api
        status:
          $ref: '#/components/schemas/RouterStatus'
        last_seen_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        notes:
          oneOf:
            - type: string
            - type: 'null'
    CreateRouterRequest:
      type: object
      required:
        - name
        - ip_address
        - api_username
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique display name.
        ip_address:
          type: string
          maxLength: 255
          description: |
            Accepts an IP, hostname, or `host:port` form. The service layer
            normalises and persists the IP/host separately from `api_port`.
          example: 192.168.88.1
        api_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8728
        api_username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          description: Stored AES-encrypted at rest; never returned in responses.
        notes:
          type: string
          maxLength: 500
    MigrateRequest:
      type: object
      required:
        - file_path
      properties:
        file_path:
          type: string
          minLength: 1
          maxLength: 512
          description: Server-side filesystem path to the legacy `config.php`.
    MigrationResult:
      type: object
      required:
        - total
        - imported
        - skipped
        - errors
      description: |
        Summary of `POST /routers/migrate` — imports legacy MIKHMON
        `config.php` data into the router/profile tables.
      properties:
        total:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
    UpdateRouterRequest:
      type: object
      description: Partial router update. Only fields provided are persisted.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        ip_address:
          type: string
          maxLength: 255
        api_port:
          type: integer
          minimum: 1
          maximum: 65535
        api_username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        notes:
          type: string
          maxLength: 500
    ConnectionTestResult:
      type: object
      required:
        - connected
        - latency_ms
      description: |
        Result of an active TCP+API probe to the router. `connected: true`
        means the API replied to `/system/identity/print` within the
        configured timeout.
      properties:
        connected:
          type: boolean
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        routeros_version:
          type: string
          example: 7.20.8
        board_model:
          type: string
          example: CCR1009-7G-1C-1S+
        identity:
          type: string
          example: MikroTik
        error:
          type: string
          description: 'Populated only when `connected: false`.'
    RouterOSRecord:
      type: object
      additionalProperties:
        type: string
      description: |
        A RouterOS sentence rendered as a flat string→string map. Keys are
        the original MikroTik names with hyphens preserved (`mac-address`,
        `bytes-in`, `dst-host`, …). The `.id` key is the RouterOS-internal
        identifier (e.g. `*A1`) and is stable across calls. Extra keys not
        listed in the property hints below may appear depending on the
        RouterOS version.
      properties:
        .id:
          type: string
          description: RouterOS internal identifier.
          example: '*A1'
    HotspotUserRecord:
      allOf:
        - $ref: '#/components/schemas/RouterOSRecord'
        - type: object
          properties:
            name:
              type: string
              example: voucher-7g3pq
            password:
              type: string
              example: 7g3pq
            profile:
              type: string
              example: 1d-1mbps
            server:
              type: string
              example: hotspot1
            mac-address:
              type: string
              example: '00:11:22:33:44:55'
            limit-uptime:
              type: string
              example: 1d
            limit-bytes-total:
              type: string
              example: '0'
            bytes-in:
              type: string
              example: '15823234'
            bytes-out:
              type: string
              example: '982341'
            uptime:
              type: string
              example: 1h12m
            disabled:
              type: string
              enum:
                - 'true'
                - 'false'
            comment:
              type: string
    ProfileWithMeta:
      type: object
      required:
        - id
        - name
      description: |
        Hotspot profile augmented with profile-mapping metadata
        (price, validity, exp-mode, lock-user, lock-server). Use this shape
        for `/hotspot/profiles` GET responses; mutation endpoints return
        `RouterOSRecord` with the freshly-set fields.
      properties:
        id:
          type: string
          example: '*A1'
        name:
          type: string
          example: 1d-1mbps
        address_pool:
          type: string
        rate_limit:
          type: string
          example: 1M/2M
        shared_users:
          type: string
          example: '1'
        status_autorefresh:
          type: string
        on_login:
          type: string
        on_logout:
          type: string
        parent_queue:
          type: string
        exp_mode:
          type: string
          example: rem
        price:
          type: string
          example: '5000'
        selling_price:
          type: string
          example: '7500'
        validity:
          type: string
          example: 1d
        no_expiry:
          type: boolean
        lock_user:
          type: string
        lock_server:
          type: string
    HotspotProfileParams:
      type: object
      required:
        - name
      description: Request body for creating or updating a hotspot profile.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        rate_limit:
          type: string
          maxLength: 64
          example: 1M/2M
        address_pool:
          type: string
          maxLength: 64
        shared_users:
          type: string
          maxLength: 8
          example: '1'
        parent_queue:
          type: string
          maxLength: 64
        price:
          type: integer
          format: int64
          minimum: 0
        selling_price:
          type: integer
          format: int64
          minimum: 0
        validity:
          type: string
          maxLength: 64
          example: 1d
        expire_mode:
          type: string
          maxLength: 32
        lock_user:
          type: string
          maxLength: 16
          example: enable
        lock_server:
          type: string
          maxLength: 16
          example: enable
    HotspotActiveRecord:
      allOf:
        - $ref: '#/components/schemas/RouterOSRecord'
        - type: object
          properties:
            user:
              type: string
              example: voucher-7g3pq
            address:
              type: string
              example: 10.5.50.23
            mac-address:
              type: string
              example: '00:11:22:33:44:55'
            server:
              type: string
              example: hotspot1
            uptime:
              type: string
              example: 1h12m
            session-time-left:
              type: string
              example: 22h47m
            keepalive-timeout:
              type: string
            login-by:
              type: string
              example: http-chap
    HotspotHostRecord:
      allOf:
        - $ref: '#/components/schemas/RouterOSRecord'
        - type: object
          properties:
            mac-address:
              type: string
            address:
              type: string
            server:
              type: string
            to-address:
              type: string
            authorized:
              type: string
              enum:
                - 'true'
                - 'false'
    HotspotServerRecord:
      allOf:
        - $ref: '#/components/schemas/RouterOSRecord'
        - type: object
          properties:
            name:
              type: string
              example: hotspot1
            interface:
              type: string
              example: ether1
            disabled:
              type: string
              enum:
                - 'true'
                - 'false'
    HotspotCookieRecord:
      allOf:
        - $ref: '#/components/schemas/RouterOSRecord'
        - type: object
          properties:
            user:
              type: string
            mac-address:
              type: string
            address:
              type: string
    IPBindingRecord:
      allOf:
        - $ref: '#/components/schemas/RouterOSRecord'
        - type: object
          properties:
            mac-address:
              type: string
              example: '00:11:22:33:44:55'
            address:
              type: string
              example: 10.5.50.23
            type:
              type: string
