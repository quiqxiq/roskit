          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum:
            - default
            - small
            - thermal
        part:
          type: string
          enum:
            - header
            - row
            - footer
        content:
          type: string
          maxLength: 65536
    RenderRequest:
