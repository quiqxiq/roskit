openapi: 3.1.0
info:
  title: Roskit API
  version: 0.1.0
  summary: MikroTik RouterOS management API.
  description: |
    Roskit exposes hotspot, PPP, network, system, voucher, and reporting
    operations across MikroTik routers.

    ## Conventions

    - All responses use the same envelope: `{ data, error }`. Exactly one
      of `data` / `error` is non-null.
    - Authentication: `Authorization: Bearer <jwt>` issued by `/auth/login`.
  contact:
    name: Roskit
    url: https://github.com/quiqxiq/roskit
  license:
    name: See repository LICENSE
    identifier: LicenseRef-Repo-LICENSE
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://{host}/api/v1
    description: Production
    variables:
      host:
        default: api.example.com
        description: Public host where Roskit is deployed.
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness / readiness checks. No auth.
  - name: status
    description: Public connectivity probe used by the login page.
  - name: auth
    description: Login, refresh, logout, password change, first-time setup.
  - name: settings
    description: Application settings and logo management (admin only).
  - name: users
    description: User management.
  - name: routers
    description: Router CRUD, connection test, config migration.
  - name: hotspot
    description: MikroTik hotspot users, profiles, sessions, hosts, bindings, walled-garden.
  - name: ppp
    description: PPP secrets, profiles, active/inactive sessions.
  - name: network
    description: Interfaces, traffic, pools, queues, NAT, DHCP.
  - name: system
    description: Router system resource, scheduler, scripts, expire-monitor.
  - name: vouchers
    description: Voucher generation, sale recording, printing.
  - name: templates
    description: Print template CRUD.
  - name: reports
    description: Daily / monthly / dashboard reports + CSV / Excel export.
  - name: quick-print
    description: Quick-print package preset CRUD (per router).
  - name: profile-mappings
    description: Per-router profile → price/validity mapping.
  - name: events
    description: Public webhook from RouterOS (on-login).
  - name: sse
    description: Server-Sent Events streams (logs + telemetry).
paths:
  /health:
    get:
      operationId: checkHealth
      summary: Liveness and dependency health probe
      tags:
        - health
      security: []
      description: |
        Returns the health of Postgres, Redis, and the MikroTik connection
        pool. `data.status` is `ok` when all dependencies are healthy and
        `degraded` otherwise. HTTP status mirrors that: 200 on `ok`, 503 on
        `degraded`. Use this for Kubernetes readiness probes.
      responses:
        '200':
          description: All dependencies healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  error:
                    type: 'null'
              example:
                data:
                  status: ok
                  services:
                    postgres: ok
                    redis: ok
                    engine:
                      routers_total: 4
                      routers_connected: 4
                error: null
        '503':
          description: At least one dependency is unavailable. Body still uses the standard envelope.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  error:
                    type: 'null'
              example:
                data:
                  status: degraded
                  services:
                    postgres: ok
                    redis: unavailable
                    engine:
                      routers_total: 4
                      routers_connected: 1
                error: null
  /status:
    get:
      operationId: getUserStatus
      summary: Hotspot user session status by MAC
      tags:
        - status
      security: []
      description: |
        Public endpoint used by the hotspot login page to show whether a
        device is currently connected. Resolves the router by name and
        looks up the active session matching the MAC.

        Returns `active: true` with session details when the MAC is in
        `ip/hotspot/active`. Returns `active: false` (with only `mac`
        populated) when no matching session exists.
      parameters:
        - in: query
          name: router
          required: true
          description: Router name as registered in the system (matches `routers.name`).
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: hotspot-1
        - in: query
          name: mac
          required: true
          description: MAC address of the device whose status is being queried.
          schema:
            type: string
            minLength: 11
            maxLength: 17
            pattern: ^[0-9A-Fa-f:.-]+$
          example: '00:11:22:33:44:55'
      responses:
        '200':
          description: User status (active session details, or inactive shell).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/UserStatus'
                  error:
                    type: 'null'
              examples:
                active:
                  summary: Currently logged in
                  value:
                    data:
                      active: true
                      username: voucher-7g3pq
                      profile: 1d-1mbps
                      ip_address: 10.5.50.23
                      mac: '00:11:22:33:44:55'
                      uptime: 1h12m
                      bytes_in: '15823234'
                      bytes_out: '982341'
                      time_left: 22h47m
                      comment: ''
                    error: null
                inactive:
                  summary: Not logged in
                  value:
                    data:
                      active: false
                      username: ''
                      profile: ''
                      ip_address: ''
                      mac: '00:11:22:33:44:55'
                      uptime: ''
                      bytes_in: ''
                      bytes_out: ''
                      time_left: ''
                      comment: ''
                    error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Exchange credentials for an access + refresh token pair
      tags:
        - auth
      security: []
      description: |
        Accepts username + password. The response includes the user view
        plus a JWT pair. Rate-limited to 10 requests/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: hunter2
      responses:
        '200':
          description: Authenticated. Returns access + refresh tokens.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
                  error:
                    type: 'null'
              example:
                data:
                  access_token: eyJhbGciOi...
                  refresh_token: eyJhbGciOi...
                  expires_in: 900
                  user:
                    id: 12
                    username: alice
                    role: admin
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Issue a new access token from a refresh token
      tags:
        - auth
      security: []
      description: |
        Exchanges a valid (non-expired, non-revoked) refresh token for a
        fresh access + refresh token pair. The original refresh token is
        revoked as part of this call (rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current access token (and optionally a refresh token)
      tags:
        - auth
      description: |
        Adds the current token's JTI to the revocation cache so it cannot
        be reused even before its `exp`. If `refresh_token` is supplied in
        the body, that refresh JTI is revoked too.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyOK'
              example:
                data:
                  message: logged out
                error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user's identity
      tags:
        - auth
      description: |
        Echo of the JWT claims as a `UserView`. Useful for the SPA to
        hydrate user state on page load without round-tripping `/users`.
      responses:
        '200':
          description: User identity.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/UserView'
                  error:
                    type: 'null'
              example:
                data:
                  id: 12
                  username: alice
                  role: admin
                error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password:
    put:
      operationId: changePassword
      summary: Change the authenticated user's password
      tags:
        - auth
      description: Requires the old password. New password must be 6–128 chars.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyOK'
              example:
                data:
                  message: password changed
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/setup:
    post:
      operationId: setupFirstAdmin
      summary: Bootstrap the first admin account
      tags:
        - auth
      security: []
      description: |
        One-shot bootstrap endpoint. Creates the first admin user. Returns
        403 once any user exists. Rate-limited to 10 requests/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
            example:
              username: admin
              password: changeme123
      responses:
        '201':
          description: First admin created and auto-logged-in.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/SetupResult'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /settings:
    get:
      operationId: getSettings
      summary: Get application settings
      tags:
        - settings
      description: Returns the global Settings singleton.
      responses:
        '200':
          description: Settings object.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Settings'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateSettings
      summary: Update application settings (partial)
      tags:
        - settings
      description: Partial update — only fields supplied in the body are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Settings'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /settings/logo:
    get:
      operationId: getLogo
      summary: Download the logo
      tags:
        - settings
      description: Returns the raw image bytes; the Content-Type header reflects the stored format.
      responses:
        '200':
          description: Binary logo image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: uploadLogo
      summary: Upload a logo image
      tags:
        - settings
      description: |
        Accepts a `multipart/form-data` body. The uploaded file is stored
        server-side and referenced by `settings.logo_path`. Use
        `GET /settings/logo` to fetch it back.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - logo
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyOK'
              example:
                data:
                  message: logo uploaded
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      operationId: listUsers
      summary: List all users
      tags:
        - users
      responses:
        '200':
          description: Array of users.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
              example:
                data:
                  - id: 1
                    username: admin
                    role: admin
                    active: true
                    last_login_at: '2026-04-30T10:11:12Z'
                    created_at: '2026-04-01T00:00:00Z'
                    updated_at: '2026-04-30T10:11:12Z'
                error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createUser
      summary: Create a user
      tags:
        - users
      description: Admins may create users with role `admin` or `staff`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              username: bob
              password: secret123
              role: staff
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a single user by ID
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateUser
      summary: Update a user (partial)
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteUser
      summary: Delete a user (soft delete)
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyOK'
              example:
                data:
                  message: user deleted
                error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /routers:
    get:
      operationId: listRouters
      summary: List all routers
      tags:
        - routers
      responses:
        '200':
          description: Array of public router views.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouterPublicView'
                  error:
                    type: 'null'
              example:
                data:
                  - id: 7
                    name: hotspot-1
                    ip_address: 192.168.88.1
                    api_port: 8728
                    api_username: api
                    status: connected
                    last_seen_at: '2026-04-30T10:11:12Z'
                    notes: null
                error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createRouter
      summary: Register a new router
      tags:
        - routers
      description: |
        Creates a router row, encrypts the API password at rest, and
        registers the router with the orchestrator so streams/pollers
        attach automatically. Conflict (409) when the name already
        exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouterRequest'
            example:
              name: hotspot-1
              ip_address: 192.168.88.1
              api_port: 8728
              api_username: api
              password: api-password
              notes: Lobby AP
      responses:
        '201':
          description: Router created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/RouterPublicView'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /routers/migrate:
    post:
      operationId: migrateRouterConfig
      summary: Import a legacy MIKHMON config.php
      tags:
        - routers
      description: |
        Reads the file path on the server, parses MIKHMON's PHP config,
        and creates corresponding router + profile-mapping rows. Idempotent
        on `name` — existing routers are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateRequest'
            example:
              file_path: /data/legacy/mikhmon/config.php
      responses:
        '200':
          description: Migration summary.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/MigrationResult'
                  error:
                    type: 'null'
              example:
                data:
                  total: 12
                  imported: 9
                  skipped: 3
                  errors: 0
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /routers/{routerId}:
    get:
      operationId: getRouter
      summary: Get a router by ID
      tags:
        - routers
      parameters:
        - $ref: '#/components/parameters/RouterId'
      responses:
        '200':
          description: Router public view.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/RouterPublicView'
                  error:
                    type: 'null'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateRouter
      summary: Update router fields (partial)
      tags:
        - routers
      parameters:
        - $ref: '#/components/parameters/RouterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRouterRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/RouterPublicView'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteRouter
      summary: Soft-delete a router
      tags:
        - routers
      description: Disconnects the router from the orchestrator pool and soft-deletes the row.
      parameters:
        - $ref: '#/components/parameters/RouterId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyOK'
              example:
                data:
                  message: router deleted
                error: null
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /routers/{routerId}/test:
    post:
      operationId: testRouterConnection
      summary: Probe an existing router's connectivity
      tags:
        - routers
      description: |
        Performs a TCP+API roundtrip to the router using its stored
        credentials. Useful after editing IP/port/credentials to verify
        everything still works without polluting the orchestrator pool.
      parameters:
        - $ref: '#/components/parameters/RouterId'
      responses:
        '200':
          description: Probe result. Always 200 — `data.connected` reflects success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/ConnectionTestResult'
                  error:
                    type: 'null'
              example:
                data:
                  connected: true
                  latency_ms: 14
