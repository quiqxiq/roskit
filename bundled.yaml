  /routers/{routerId}/vouchers/generate:
    post:
      operationId: generateVouchers
      summary: Bulk-create hotspot voucher users on the router
      tags:
        - vouchers
      description: |
        Generates `qty` hotspot users with random usernames/passwords from
        the requested character set, attaches them to `profile`, and caches
        the batch in Redis under a `gencode` so the printer endpoint can
        pull the same list later.
      parameters:
        - $ref: '#/components/parameters/RouterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherGenerateParams'
            example:
              qty: 50
              profile: 1d-1mbps
              user_type: vc
              name_length: 6
              prefix: WIFI-
              time_limit: 1d
              comment: 2026-04-30 batch
      responses:
        '201':
          description: Batch generated. `data.gencode` is the print key.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/VoucherGenerateResult'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /routers/{routerId}/vouchers/cache:
    post:
      operationId: getCachedVoucherBatch
      summary: Retrieve a cached voucher batch by gencode
      tags:
        - vouchers
      description: |
        Looks up the cached generation result for `gencode`. Used when the
        printer page reloads after generation. Cache TTL is enforced
        server-side (Redis); expired batches return 404.
      parameters:
        - $ref: '#/components/parameters/RouterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gencode
              properties:
                gencode:
                  type: string
                  minLength: 4
                  maxLength: 64
      responses:
        '200':
          description: Cached batch.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/VoucherGenerateResult'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
