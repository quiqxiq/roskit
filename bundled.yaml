    VoucherGenerateParams:
      type: object
      required:
        - qty
        - profile
      description: Bulk-generate hotspot voucher users on the router.
      properties:
        qty:
          type: integer
          minimum: 1
          maximum: 1000
          example: 50
        server:
          type: string
          maxLength: 64
          example: hotspot1
        user_type:
          type: string
          maxLength: 32
          description: Generation mode (e.g. `vc` for username==password, `up` for separate fields).
          example: vc
        name_length:
          type: integer
          minimum: 3
          maximum: 32
          default: 8
        prefix:
          type: string
          maxLength: 16
          example: WIFI-
        char_set:
          type: string
          maxLength: 64
          description: Optional explicit character set; defaults to alpha+numeric.
        profile:
          type: string
          minLength: 1
          maxLength: 64
          example: 1d-1mbps
        time_limit:
          type: string
          maxLength: 64
          example: 1d
        data_limit:
          type: integer
          format: int64
          minimum: 0
          description: Bytes total; 0 means no limit.
        comment:
          type: string
          maxLength: 200
        gencode:
          type: string
          maxLength: 64
          description: |
            Optional batch identifier. When omitted Roskit generates one and
            returns it; clients should keep this for the cache + print flow.
