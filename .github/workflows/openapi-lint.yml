name: OpenAPI Lint

on:
  push:
    paths:
      - 'docs/openapi/**'
      - '.github/workflows/openapi-lint.yml'
  pull_request:
    paths:
      - 'docs/openapi/**'
      - '.github/workflows/openapi-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Redocly lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint docs/openapi/openapi.yaml --config docs/openapi/redocly.yaml

      - name: Bundle (smoke check resolves all $refs)
        run: npx --yes @redocly/cli@latest bundle docs/openapi/openapi.yaml -o /tmp/_bundled.yaml --config docs/openapi/redocly.yaml
