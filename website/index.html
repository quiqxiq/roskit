<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roskit — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#6366f1"/>
          <path d="M10 20h20M20 10v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="4" fill="#fff"/>
        </svg>
        <span>Roskit</span>
      </div>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">MikroTik Management Dashboard</p>

      <div id="auth-error" class="alert alert-error hidden"></div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <span class="btn-text">Sign in</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8080/api/v1';

    const form = document.getElementById('login-form');
    const errBox = document.getElementById('auth-error');
    const btn = document.getElementById('login-btn');

    // If already logged in, redirect
    if (localStorage.getItem('access_token')) {
      window.location.href = 'app.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      btn.querySelector('.btn-text').textContent = 'Signing in…';
      btn.querySelector('.spinner').classList.remove('hidden');
      btn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const body = await res.json();

        if (!res.ok) {
          throw new Error(body.error || 'Login failed');
        }

        const { access_token, refresh_token, user } = body.data;
        localStorage.setItem('access_token', access_token);
        localStorage.setItem('refresh_token', refresh_token);
        localStorage.setItem('user', JSON.stringify(user));
        window.location.href = 'app.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
        btn.querySelector('.btn-text').textContent = 'Sign in';
        btn.querySelector('.spinner').classList.add('hidden');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
