# --- live ping stream -----------------------------------------------------------
# Unlike telemetry endpoints (pub-sub via Redis), ping connects directly to the
# router and streams live `/ping` results. Each reply sentence from RouterOS
# becomes one SSE event.

ping:
  get:
    operationId: streamPing
    summary: SSE — live RouterOS ping stream
    description: |
      Runs `/ping` on the target router and streams each reply sentence
      as an SSE event. If `count` is omitted or `0`, pings continuously
      until the client disconnects; otherwise the stream ends after `count`
      replies with a final `event: done` frame.

      **Note:** This endpoint does NOT use the Redis pub-sub telemetry
      pipeline. It opens a direct RouterOS API listen connection, so the
      stream ends when the ping command finishes or the client disconnects.
    tags: [sse]
    x-sse: true
    parameters:
      - $ref: '../components/parameters.yaml#/RouterId'
      - in: query
        name: address
        required: true
        schema: { type: string }
        description: IP address or hostname to ping.
        example: 8.8.8.8
      - in: query
        name: count
        required: false
        schema: { type: integer, minimum: 0, default: 0 }
        description: |
          Number of pings to send. `0` (default) means continuous —
          stream stops only when the client disconnects or the context
          is cancelled.
        example: 5
      - in: query
        name: token
        schema: { type: string }
        description: Access JWT for clients that cannot send the `Authorization` header (EventSource).
    responses:
      '200':
        description: Stream opens. Each `data:` frame contains a `PingEvent`.
        content:
          text/event-stream:
            schema: { $ref: '../components/schemas/sse.yaml#/PingEvent' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
