# Tenant self-management (/tenant/*) + admin (/admin/tenants/*).
#
# Source: internal/api/handlers/tenant_handler.go.

# ---------------- /tenant (self-management, owner) ----------------------------

getSelf:
  get:
    operationId: getOwnTenant
    summary: Get the tenant the caller belongs to
    tags: [tenants]
    description: Returns the JWT-resolved tenant including its settings.
    responses:
      '200':
        description: Tenant + settings.
        content:
          application/json:
            schema:
              type: object
              required: [data, error]
              properties:
                data:  { $ref: '../components/schemas/tenant.yaml#/Tenant' }
                error: { type: 'null' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

updateSelfName:
  put:
    operationId: updateOwnTenantName
    summary: Rename the caller's tenant
    tags: [tenants]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/tenant.yaml#/UpdateTenantNameRequest' }
    responses:
      '200':
        description: Updated.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/EmptyOK' }
            example:
              data: { message: tenant updated }
              error: null
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

getSelfSettings:
  get:
    operationId: getOwnTenantSettings
    summary: Read the caller tenant's settings
    tags: [tenants]
    responses:
      '200':
        description: Tenant settings.
        content:
          application/json:
            schema:
              type: object
              required: [data, error]
              properties:
                data:  { $ref: '../components/schemas/tenant.yaml#/TenantSettings' }
                error: { type: 'null' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

updateSelfSettings:
  put:
    operationId: updateOwnTenantSettings
    summary: Patch the caller tenant's settings
    tags: [tenants]
    description: Partial — only fields supplied in the body are changed.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/tenant.yaml#/UpdateTenantSettingsRequest' }
    responses:
      '200':
        description: Updated tenant settings.
        content:
          application/json:
            schema:
              type: object
              required: [data, error]
              properties:
                data:  { $ref: '../components/schemas/tenant.yaml#/TenantSettings' }
                error: { type: 'null' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

uploadLogo:
  post:
    operationId: uploadTenantLogo
    summary: Upload a logo image for the tenant
    tags: [tenants]
    description: |
      Accepts a `multipart/form-data` body. The uploaded file is stored
      server-side and referenced by `tenant_settings.logo_path`. Use
      `GET /tenant/logo` to fetch it back.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: Logo accepted.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/EmptyOK' }
            example:
              data: { message: logo uploaded }
              error: null
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

getLogo:
  get:
    operationId: getTenantLogo
    summary: Download the tenant logo
    tags: [tenants]
    description: Returns the raw image bytes; the Content-Type header reflects the stored format.
    responses:
      '200':
        description: Binary logo image.
        content:
          image/png:  { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ---------------- /admin/tenants (superadmin) ---------------------------------

adminList:
  get:
    operationId: adminListTenants
    summary: List all tenants (superadmin)
    tags: [admin]
    responses:
      '200':
        description: Array of tenants.
        content:
          application/json:
            schema:
              type: object
              required: [data, error]
              properties:
                data:
                  type: array
                  items: { $ref: '../components/schemas/tenant.yaml#/Tenant' }
                error: { type: 'null' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

adminCreate:
  post:
    operationId: adminCreateTenant
    summary: Create a new tenant (superadmin)
    tags: [admin]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/tenant.yaml#/CreateTenantRequest' }
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              type: object
              required: [data, error]
              properties:
                data:  { $ref: '../components/schemas/tenant.yaml#/Tenant' }
                error: { type: 'null' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

adminGet:
  get:
    operationId: adminGetTenant
    summary: Get a tenant by ID (superadmin)
    tags: [admin]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    responses:
      '200':
        description: Tenant details.
        content:
          application/json:
            schema:
              type: object
              required: [data, error]
              properties:
                data:  { $ref: '../components/schemas/tenant.yaml#/Tenant' }
                error: { type: 'null' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

adminUpdate:
  put:
    operationId: adminUpdateTenant
    summary: Update tenant fields (superadmin)
    tags: [admin]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/tenant.yaml#/AdminUpdateTenantRequest' }
    responses:
      '200':
        description: Updated.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/EmptyOK' }
            example:
              data: { message: tenant updated }
              error: null
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

adminHardDelete:
  delete:
    operationId: adminHardDeleteTenant
    summary: Permanently delete a tenant (superadmin, destructive)
    tags: [admin]
    description: |
      Hard delete — removes the tenant row and cascades to settings,
      users, routers, audit_logs, etc. Cannot be undone.
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    responses:
      '200':
        description: Tenant deleted.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/EmptyOK' }
            example:
              data: { message: tenant deleted }
              error: null
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

adminSuspend:
  post:
    operationId: adminSuspendTenant
    summary: Suspend a tenant (superadmin)
    tags: [admin]
    description: Sets status to `suspended`; users in this tenant get 403 on every request.
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    responses:
      '200':
        description: Suspended.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/EmptyOK' }
            example:
              data: { message: tenant suspended }
              error: null
      '404': { $ref: '../components/responses.yaml#/NotFound' }

adminActivate:
  post:
    operationId: adminActivateTenant
    summary: Reactivate a suspended tenant (superadmin)
    tags: [admin]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    responses:
      '200':
        description: Activated.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/EmptyOK' }
            example:
              data: { message: tenant activated }
              error: null
      '404': { $ref: '../components/responses.yaml#/NotFound' }
