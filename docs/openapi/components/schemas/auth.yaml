# Auth-related request/response schemas.
#
# Source: internal/api/handlers/auth_handler.go (request structs) +
#         internal/services/auth_service.go (LoginResult, UserView, Claims).

UserRole:
  type: string
  enum: [owner, admin, staff, superadmin]
  description: |
    Tenant role. `superadmin` users have `tenant_id == null` and operate
    across all tenants via Casbin's wildcard domain.

UserView:
  type: object
  required: [id, username, role, tenant_slug]
  description: User identity returned in `/auth/me` and embedded in `LoginResult`.
  properties:
    id:
      type: integer
      format: int64
      example: 12
    username:
      type: string
      example: alice
    role:
      $ref: '#/UserRole'
    tenant_id:
      oneOf:
        - type: integer
          format: int64
          example: 3
        - type: 'null'
      description: Null for superadmins.
    tenant_slug:
      type: string
      example: acme

LoginRequest:
  type: object
  required: [username, password]
  properties:
    tenant:
      type: string
      maxLength: 100
      description: Tenant slug. Optional only for superadmin login.
      example: acme
    username:
      type: string
      minLength: 1
      maxLength: 64
      example: alice
    password:
      type: string
      minLength: 1
      maxLength: 128
      format: password
      example: hunter2

LoginResult:
  type: object
  required: [access_token, refresh_token, expires_in, user]
  properties:
    access_token:
      type: string
      description: JWT access token. Short-lived (~15 min).
    refresh_token:
      type: string
      description: Opaque-looking JWT signed with the refresh secret. Longer-lived (~7 d).
    expires_in:
      type: integer
      description: Lifetime of the access token in seconds.
      example: 900
    user:
      $ref: '#/UserView'

RefreshRequest:
  type: object
  required: [refresh_token]
  properties:
    refresh_token:
      type: string
      minLength: 10
      maxLength: 4096

LogoutRequest:
  type: object
  description: |
    Optional body. Logout always revokes the *access* token (via JTI in
    JWT claims). When `refresh_token` is provided it is revoked too — do
    this from the original device to log out everywhere.
  properties:
    refresh_token:
      type: string
      maxLength: 4096

ChangePasswordRequest:
  type: object
  required: [old_password, new_password]
  properties:
    old_password:
      type: string
      minLength: 1
      maxLength: 128
      format: password
    new_password:
      type: string
      minLength: 6
      maxLength: 128
      format: password

SetupRequest:
  type: object
  required: [tenant_name, tenant_slug, username, password]
  description: |
    Bootstrap the very first tenant + owner. Available only when the
    `users` table is empty; subsequent calls return 403.
  properties:
    tenant_name:
      type: string
      minLength: 2
      maxLength: 100
      example: Acme Corp
    tenant_slug:
      type: string
      minLength: 2
      maxLength: 100
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,98}[a-z0-9])?$'
      example: acme
    username:
      type: string
      minLength: 3
      maxLength: 64
      example: owner
    password:
      type: string
      minLength: 6
      maxLength: 128
      format: password

SetupResult:
  type: object
  required: [tenant, user, access_token, refresh_token, expires_in]
  description: First tenant + auto-issued access tokens for the new owner.
  properties:
    tenant:
      type: object
      required: [id, name, slug]
      properties:
        id:    { type: integer, format: int64, example: 1 }
        name:  { type: string, example: Acme Corp }
        slug:  { type: string, example: acme }
    user:
      type: object
      required: [id, username, role]
      properties:
        id:       { type: integer, format: int64, example: 1 }
        username: { type: string, example: owner }
        role:     { $ref: '#/UserRole' }
    access_token:  { type: string }
    refresh_token: { type: string }
    expires_in:    { type: integer, example: 900 }
