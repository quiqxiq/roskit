# Tenant + tenant_settings schemas.
#
# Source:
#   internal/models/tenant.go (Tenant)
#   internal/models/tenant_settings.go (TenantSettings)
#   internal/services/tenant_service.go (CreateTenantRequest, UpdateTenantSettingsRequest)
#
# Note: TenantSettings.WebhookToken is `json:"-"` and never exposed.

TenantStatus:
  type: string
  enum: [active, trial, suspended]

TenantPlan:
  type: string
  enum: [free, starter, pro]

Tenant:
  type: object
  required: [id, name, slug, plan, status, created_at, updated_at]
  properties:
    id:         { type: integer, format: int64, example: 1 }
    name:       { type: string, example: Acme Corp }
    slug:       { type: string, example: acme }
    plan:       { $ref: '#/TenantPlan' }
    status:     { $ref: '#/TenantStatus' }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }
    settings:
      oneOf:
        - $ref: '#/TenantSettings'
        - type: 'null'
      description: Optional. Populated by GetSelf and AdminGet.

TenantSettings:
  type: object
  required: [id, tenant_id, currency, idle_timeout, report_mode, logo_path, timezone, created_at, updated_at]
  description: |
    Tenant-scoped configuration. The webhook token used by `/events/on-login`
    is *not* exposed in this object — request it explicitly only via the
    private rotation endpoint when one is added in future.
  properties:
    id:           { type: integer, format: int64 }
    tenant_id:    { type: integer, format: int64 }
    hotspot_name: { type: string, maxLength: 100, example: 'My Hotspot' }
    dns_name:     { type: string, maxLength: 100, example: 'login.acme.test' }
    currency:     { type: string, maxLength: 10, example: 'Rp' }
    phone:        { type: string, maxLength: 20, example: '+62-555-0100' }
    email:        { type: string, maxLength: 100, example: 'admin@acme.test' }
    info_lp:      { type: string, description: 'Free-form text shown on the hotspot login page.' }
    idle_timeout:
      type: integer
      minimum: 0
      maximum: 86400
      description: Hotspot idle timeout in minutes.
      example: 30
    report_mode:
      type: string
      enum: [disable, enable]
    logo_path:    { type: string, description: 'Server-side filesystem path; not directly client-accessible.' }
    timezone:     { type: string, maxLength: 50, example: 'Asia/Jakarta' }
    created_at:   { type: string, format: date-time }
    updated_at:   { type: string, format: date-time }

UpdateTenantNameRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100

UpdateTenantSettingsRequest:
  type: object
  description: |
    Partial update — every field is optional. Omitted fields are left
    unchanged on the existing TenantSettings row.
  properties:
    hotspot_name: { type: string, maxLength: 100 }
    dns_name:     { type: string, maxLength: 255 }
    currency:     { type: string, maxLength: 8 }
    phone:        { type: string, maxLength: 32 }
    email:        { type: string, format: email, maxLength: 255 }
    info_lp:      { type: string, maxLength: 2000 }
    idle_timeout: { type: integer, minimum: 0, maximum: 86400 }
    report_mode:  { type: string, enum: [disable, enable] }
    timezone:     { type: string, maxLength: 64 }

CreateTenantRequest:
  type: object
  required: [name, slug]
  properties:
    name:         { type: string, minLength: 2, maxLength: 100 }
    slug:
      type: string
      minLength: 2
      maxLength: 100
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,98}[a-z0-9])?$'
    plan:         { $ref: '#/TenantPlan' }
    hotspot_name: { type: string, maxLength: 100 }
    dns_name:     { type: string, maxLength: 255 }
    currency:     { type: string, maxLength: 8 }
    phone:        { type: string, maxLength: 32 }
    email:        { type: string, format: email, maxLength: 255 }
    idle_timeout: { type: integer, minimum: 0, maximum: 86400 }
    report_mode:  { type: string, enum: [disable, enable] }

AdminUpdateTenantRequest:
  type: object
  description: Patch-style update for superadmin tenant edit.
  properties:
    name:   { type: string, minLength: 2, maxLength: 100 }
    plan:   { $ref: '#/TenantPlan' }
    status: { $ref: '#/TenantStatus' }
